<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klubeko Kuotaren Ordainketa</title>
  <style>
    :root {
      --primary-blue: #0052ff;
      --primary-blue-hover: #0040cc;
      --bg-gradient: #edf3fc;
      --card-bg: #ffffff;
      --border-color: #d1e2ff;
      --text-color: #1a2b49;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-gradient);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    .header-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header-logo {
      height: 55px;
      width: auto;
    }

    .header-title {
      color: var(--primary-blue);
      font-size: 24px;
      font-weight: 800;
      margin: 0;
    }

    /* Main Container Card */
    .main-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Account Box */
    .account-box {
      background-color: #f2f7ff;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .account-title {
      color: var(--primary-blue);
      font-weight: 700;
      font-size: 13px;
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .account-number {
      font-weight: 800;
      font-size: 16px;
    }

    .btn-copy {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--primary-blue);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
      color: #334e68;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus {
      border-color: var(--primary-blue);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      color: #486581;
      margin-bottom: 25px;
    }

    .checkbox-group input {
      margin-top: 2px;
    }

    /* Section Title */
    .section-title {
      color: var(--primary-blue);
      font-size: 20px;
      font-weight: 800;
      margin: 25px 0 15px 0;
    }

    /* Player Card */
    .player-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
      position: relative;
    }

    .player-title {
      color: var(--primary-blue);
      font-size: 16px;
      font-weight: 800;
      margin-top: 0;
      margin-bottom: 15px;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-remove {
      background: #fff1f0;
      border: 1px solid #ffa39e;
      color: #e84118;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Buttons */
    .btn-blue {
      background-color: var(--primary-blue);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-blue:hover {
      background-color: var(--primary-blue-hover);
    }

    /* File Input Card */
    .file-card {
      background-color: #f8fbff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 15px;
    }

    /* Total Box */
    .total-box {
      background-color: #f2f7ff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 15px;
      text-align: right;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-blue);
      margin: 200 px 0 15px 0;
    }

    #loading {
      display: none;
      text-align: center;
      color: var(--primary-blue);
      font-weight: bold;
      margin-top: 10px;
    }

    .error-msg {
      display: none;
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    #successCard {
      display: none;
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header con Logo y Título -->
    <div class="header-card">
      <img src="https://unkinasaskitaldea.com/wp-content/uploads/2021/09/cropped-unkina_saski_taldea_escudo.png" alt="Logo Unkina" class="header-logo" onerror="this.style.display='none'">
      <h1 class="header-title">Klubeko Kuotaren Ordainketa</h1>
    </div>

    <!-- Formulario Principal -->
    <div class="main-card" id="formCard">
      
      <!-- Kontu Korrontea -->
      <div class="account-box">
        <div class="account-title">Ordainketarako Kontu Korrontea:</div>
        <div class="account-row">
          <span class="account-number" id="ibanText">ES42 2100 6307 1201 0007 9562</span>
          <button type="button" class="btn-copy" onclick="copyIban()">📋 Kopiatu</button>
        </div>
      </div>

      <div id="errorMsg" class="error-msg"></div>

      <form id="kuotaForm">
        <!-- Posta eta Telefonoa -->
        <div class="form-group">
          <label for="email">Jokalari / Guraso edo Tutorearen Posta Elektronikoa *</label>
          <input type="email" id="email" placeholder="adibidea@email.com" required>
        </div>

        <div class="form-group">
          <label for="telefonoa">Harremanetarako Telefonoa *</label>
          <input type="tel" id="telefonoa" placeholder="600 00 00 00" required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="aceptaComunicaciones" required checked>
          <label for="aceptaComunicaciones" style="display:inline; font-weight:normal;">
            Onartzen dut informazioa eta komunikazioak emandako telefono-zenbakian jasotzea.
          </label>
        </div>

        <!-- Jokalariak -->
        <div class="section-title">Jokalarien Datuak</div>
        
        <div id="jokalariakContainer"></div>

        <button type="button" class="btn-blue" style="margin-bottom: 25px;" onclick="addJokalaria()">
          + Gehitu beste jokalari bat (Anai-arrebak)
        </button>

        <!-- Ordainagiria -->
        <div class="form-group">
          <label>Igo transferentziaren ordainagiria (PDF edo argazkia) *</label>
          <div class="file-card">
            <input type="file" id="ordainagiria" accept=".pdf,.jpg,.jpeg,.png,.webp" required>
          </div>
        </div>

        <!-- Totala -->
        <div class="total-box">
          Guztira ordaindu beharrekoa: <span id="totalDisplay">0</span> €
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-blue" id="btnSubmit">
          Bidali Datuak eta Ordainagiria
        </button>
      </form>

      <div id="loading">Bidaltzen... Mesedez itxaron.</div>
    </div>

    <!-- Mensaje de éxito -->
    <div class="main-card" id="successCard">
      <h2 style="color: var(--primary-blue);">Eskerrik asko!</h2>
      <p>Datuak eta ordainagiria egokiro bidali dira. Mezu bat jaso beharko zenuke zure posta elektronikoan.</p>
    </div>

  </div>

  <script>
    // URL DE TU SCRIPT DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZrQ5eEEAXvR2M3W3oaO2tG6hCB4bd46w25dpDZbw/dev";

    let jokalariKopurua = 0;
    let taldeakList = ["Besteak"];

    // Cargar equipos desde Apps Script si es posible
    window.addEventListener('DOMContentLoaded', () => {
      addJokalaria();
      loadTaldeak();
    });

    async function loadTaldeak() {
      try {
        const res = await fetch(SCRIPT_URL + "?action=getTaldeak");
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          taldeakList = data;
          updateAllTaldeakDropdowns();
        }
      } catch (e) {
        console.log("Ezin izan dira taldeak kargatu, 'Besteak' erabiliko da");
      }
    }

    function copyIban() {
      const iban = document.getElementById('ibanText').innerText;
      navigator.clipboard.writeText(iban);
      alert("IBAN kopiatuta: " + iban);
    }

    function addJokalaria() {
      const container = document.getElementById('jokalariakContainer');
      const index = jokalariKopurua;
      const card = document.createElement('div');
      card.className = 'player-card';
      card.id = `jokalari_${index}`;

      card.innerHTML = `
        <div class="player-title">
          <span>Jokalaria ${index + 1}</span>
          ${index > 0 ? `<button type="button" class="btn-remove" onclick="removeJokalaria(${index})">X Kendu</button>` : ''}
        </div>

        <div class="form-group">
          <label>Izen-Abizenak *</label>
          <input type="text" id="jokalari_izena_${index}" required>
        </div>

        <div class="form-group">
          <label>Aurreinskripzioa (60€) ordaindu duzu? *</label>
          <select id="jokalari_aurreinskripzioa_${index}" onchange="calculateTotal()">
            <option value="bai">Bai (60€ kenduko dira kuotatik)</option>
            <option value="ez">Ez</option>
          </select>
        </div>

        <div class="form-group">
          <label>Kategoria *</label>
          <select id="jokalari_kategoria_${index}" onchange="calculateTotal()" required>
            <option value="">Aukeratu Kategoria</option>
            <option value="Txikiak">Txikiak (85€)</option>
            <option value="Eskolarrak">Eskolarrak (170€)</option>
            <option value="Kadeteak_Beteranak">Kadeteak / Beteranak (190€)</option>
            <option value="Junior_Senior">Junior / Senior (230€)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Taldea *</label>
          <select id="jokalari_taldea_${index}" required>
            ${getTaldeakOptions()}
          </select>
        </div>
      `;

      container.appendChild(card);
      jokalariKopurua++;
      calculateTotal();
    }

    function getTaldeakOptions() {
      return taldeakList.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function updateAllTaldeakDropdowns() {
      for (let i = 0; i < jokalariKopurua; i++) {
        const select = document.getElementById(`jokalari_taldea_${i}`);
        if (select) {
          const currentVal = select.value;
          select.innerHTML = getTaldeakOptions();
          if (taldeakList.includes(currentVal)) select.value = currentVal;
        }
      }
    }

    function removeJokalaria(index) {
      const card = document.getElementById(`jokalari_${index}`);
      if (card) {
        card.remove();
        calculateTotal();
      }
    }

    function getBaseKuota(kategoria) {
      switch (kategoria) {
        case "Txikiak": return 85;
        case "Eskolarrak": return 170;
        case "Kadeteak_Beteranak": return 190;
        case "Junior_Senior": return 230;
        default: return 0;
      }
    }

    function calculateTotal() {
      const list = [];
      for (let i = 0; i < jokalariKopurua; i++) {
        const katEl = document.getElementById(`jokalari_kategoria_${i}`);
        const aurreEl = document.getElementById(`jokalari_aurreinskripzioa_${i}`);
        if (katEl) {
          const kategoria = katEl.value;
          const aurreInsk = aurreEl ? aurreEl.value : 'bai';
          const base = getBaseKuota(kategoria);
          if (base > 0) {
            list.push({ base, aurreInsk });
          }
        }
      }

      list.sort((a, b) => b.base - a.base);

      let total = 0;
      list.forEach((item, idx) => {
        let kuota = item.base;
        if (idx > 0) kuota *= 0.5;
        if (item.aurreInsk === 'bai') kuota = Math.max(0, kuota - 60);
        total += kuota;
      });

      document.getElementById('totalDisplay').innerText = total;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.toString().replace(/^data:(.*,)?/, ''));
        reader.onerror = error => reject(error);
      });
    }

    document.getElementById('kuotaForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const errDiv = document.getElementById('errorMsg');
      errDiv.style.display = 'none';

      const fileInput = document.getElementById('ordainagiria');
      if (!fileInput.files.length) {
        errDiv.innerText = "Mesedez, hautatu ordainagiria.";
        errDiv.style.display = 'block';
        return;
      }

      const file = fileInput.files[0];
      if (file.size > 10 * 1024 * 1024) {
        errDiv.innerText = "Fitxategiak gehienez 10MB izan ditzake.";
        errDiv.style.display = 'block';
        return;
      }

      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('loading').style.display = 'block';

      try {
        const base64File = await fileToBase64(file);

        const payload = {
          lang: "eu",
          email: document.getElementById('email').value,
          telefonoa: document.getElementById('telefonoa').value,
          aceptaComunicaciones: document.getElementById('aceptaComunicaciones').checked,
          jokalariKopurua: jokalariKopurua,
          ordainagiria: {
            name: file.name,
            mimeType: file.type,
            base64: base64File
          }
        };

        for (let i = 0; i < jokalariKopurua; i++) {
          const izena = document.getElementById(`jokalari_izena_${i}`);
          if (izena) {
            payload[`jokalari_izena_${i}`] = izena.value;
            payload[`jokalari_kategoria_${i}`] = document.getElementById(`jokalari_kategoria_${i}`).value;
            payload[`jokalari_aurreinskripzioa_${i}`] = document.getElementById(`jokalari_aurreinskripzioa_${i}`).value;
            payload[`jokalari_taldea_${i}`] = document.getElementById(`jokalari_taldea_${i}`).value;
          }
        }

        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.success) {
          document.getElementById('formCard').style.display = 'none';
          document.getElementById('successCard').style.display = 'block';
        } else {
          throw new Error(resData.error || "Errorea gertatu da bidaltzean.");
        }

      } catch (err) {
        errDiv.innerText = err.message || "Errorea gertatu da zerbitzariarekin konektatzean.";
        errDiv.style.display = 'block';
      } finally {
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('loading').style.display = 'none';
      }
    });
  </script>
</body>
</html>
