<!DOCTYPE html>
<html lang="eu">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">



  <style>
    :root {
      --club-blue: #0755f5;
      --club-blue-dark: #0645ce;
      --club-blue-light: #eaf3ff;
      --club-line: #c7ddff;
      --club-text: #243854;
      --club-muted: #60799e;
      --club-white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px 18px 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--club-text);
      background: linear-gradient(145deg, #dceaff 0%, #eef5ff 52%, #e1edff 100%);
      overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1380px; margin: 0 auto; position: relative; z-index: 1; }
    .panel {
      background: rgba(255,255,255,.97); border: 1px solid #dce9ff;
      border-radius: 19px; margin-bottom: 18px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(21, 76, 163, .07);
    }
    .panel-content { padding: 23px; }
    #langSelector {
      position: relative; padding: 16px 20px 22px; text-align: center;
      background: linear-gradient(110deg, #fafdff, #edf5ff 48%, #fafdff);
      overflow: hidden;
    }
    #langSelector::before, #langSelector::after {
      content: ""; position: absolute; top: 16px; width: 125px; height: 225px;
      border-radius: 70% 48% 60% 35%; background: rgba(83,151,255,.22);
      pointer-events: none;
    }
    #langSelector::before { left: -18px; transform: rotate(-16deg); }
    #langSelector::after { right: -18px; transform: rotate(16deg); }
    .club-logo {
      display: block; width: 142px; max-width: 60%; height: auto; object-fit: contain;
      margin: 0 auto 11px; background: #fff; border-radius: 10px; position: relative; z-index: 1;
    }
    .lang-title {
      position: relative; z-index: 1; margin: 0 0 8px;
      color: var(--club-blue); font-size: clamp(22px, 3vw, 31px); line-height: 1.22; font-weight: 850;
    }
    button { font-family: inherit; transition: background .16s ease, transform .16s ease, box-shadow .16s ease; }
    .btn-lang {
      position: relative; z-index: 1; min-width: 195px; margin: 10px 6px 0;
      padding: 12px 23px; border-radius: 10px; border: 1.5px solid var(--club-blue);
      background: var(--club-blue); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn-lang + .btn-lang { background: #fff; color: var(--club-blue); }
    .btn-lang:hover, .btn-add:hover, .btn-submit:hover { background: var(--club-blue-dark); color: #fff; transform: translateY(-1px); }
    #mainForm { display: none; }
    .brand-header {
      display: grid; grid-template-columns: 145px 1fr 145px; align-items: center;
      gap: 12px; padding: 22px 22px 18px; text-align: left;
      border-top: 4px solid var(--club-blue);
    }
    .brand-header .club-logo { width: 120px; margin: 0 auto; }
    .brand-header h2 { grid-column: 2; grid-row: 1; text-align: left; margin-bottom: 7px; }
    h2 { color: var(--club-blue); font-size: clamp(24px, 3vw, 30px); line-height: 1.2; font-weight: 850; letter-spacing: -.025em; margin: 0 0 9px; }
    .bank-info {
      display: block;
      background: linear-gradient(100deg, #edf5ff, #f5f9ff);
      border: 1px solid var(--club-line); border-left: 5px solid var(--club-blue);
      padding: 16px 19px; margin-bottom: 19px; border-radius: 8px; line-height: 1.55; overflow-wrap: anywhere;
    }
    .bank-info strong { display: block; color: var(--club-blue); margin-bottom: 5px; }
    .bank-info small { display: block; margin-top: 7px; color: var(--club-muted); }
    .bank-account-row { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .bank-info code { display: inline-block; margin: 0; color: #233a5d; font-family: inherit; font-size: 17px; font-weight: 850; letter-spacing: .025em; }
    .copy-account-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      min-width: 32px; min-height: 30px; padding: 5px 8px; border: 1px solid #bfd5ff;
      border-radius: 7px; background: #fff; color: var(--club-blue); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 750; line-height: 1;
      transition: background .15s ease, border-color .15s ease;
    }
    .copy-account-btn:hover { background: #e0edff; border-color: var(--club-blue); }
    .copy-account-btn:focus-visible { outline: 2px solid var(--club-blue); outline-offset: 2px; }
    .copy-account-btn svg { width: 14px; height: 14px; flex: 0 0 14px; }
    .copy-feedback { display: inline-block; min-width: 1px; color: var(--club-blue-dark); font-size: 12px; font-weight: 750; }
    .form-group { margin-bottom: 17px; }
    label { display: block; margin-bottom: 7px; color: #334765; font-size: 14px; font-weight: 750; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="file"], select {
      display: block; width: 100%; min-height: 45px; padding: 10px 12px;
      border: 1px solid #cbdaf0; border-radius: 9px; background: #fff;
      color: var(--club-text); font: inherit; font-size: 14px;
    }
    input[type="file"] { background: #f8fbff; padding: 8px; }
    input:focus, select:focus { outline: 3px solid rgba(7,85,245,.13); border-color: var(--club-blue); }
    .section-title { margin: 0 0 12px; color: var(--club-blue); font-size: 22px; font-weight: 850; }
    .jokalari-card { margin-bottom: 13px; padding: 17px; background: #fff; border: 1px solid var(--club-line); border-radius: 10px; }
    .jokalari-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #e5efff; color: var(--club-blue); font-weight: 850; }
    .btn-remove { padding: 7px 10px; border: 1px solid #f1c6c2; border-radius: 7px; background: #fff; color: #b42318; cursor: pointer; font-weight: 700; }
    .btn-add, .btn-submit {
      display: block; width: 100%; padding: 13px 16px; border: 1px solid var(--club-blue);
      border-radius: 9px; background: var(--club-blue); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
    }
    .btn-add { margin-bottom: 19px; }
    .btn-submit:disabled { opacity: .6; cursor: wait; }
    .summary-box {
      margin: 18px 0; padding: 15px 18px; border: 1px solid var(--club-line); border-radius: 9px;
      background: linear-gradient(100deg, #eaf3ff, #f3f8ff); text-align: right;
      color: var(--club-blue-dark); font-size: 19px; font-weight: 850;
    }
    #loading { display: none; margin-top: 15px; color: var(--club-blue); text-align: center; font-weight: 750; }
    .error-message { display: none; margin-bottom: 16px; padding: 13px; border: 1px solid #ffd4d0; border-radius: 8px; background: #fff1f0; color: #a32118; overflow-wrap: anywhere; }
    .success-header { padding: 34px 24px; border-top: 4px solid var(--club-blue); text-align: center; }
    .success-header h2 { margin-bottom: 16px; color: var(--club-blue); }
    .success-header p { margin: 0; color: var(--club-muted); font-size: 16px; line-height: 1.65; }
    hr { margin: 21px 0 !important; border: 0; border-top: 1px solid #d8e6fb !important; }
    #mainForm::after {
      content: ""; display: block; height: 95px; margin: 0 -23px -23px;
      background:
        radial-gradient(circle at 12% 100%, transparent 0 42px, rgba(7,85,245,.8) 43px 47px, transparent 48px),
        radial-gradient(circle at 92% 115%, transparent 0 50px, rgba(7,85,245,.72) 51px 56px, transparent 57px),
        linear-gradient(165deg, transparent 0 40%, rgba(58,133,255,.15) 41% 52%, transparent 53%);
      pointer-events: none;
    }
    @media (min-width: 760px) {
      #kuotaForm > .form-group:nth-of-type(1), #kuotaForm > .form-group:nth-of-type(2) {
        width: calc(50% - 13px); display: inline-block; vertical-align: top;
      }
      #kuotaForm > .form-group:nth-of-type(1) { margin-right: 20px; }
    }
    @media (max-width: 700px) {
      body { padding: 10px 8px 0; }
      .panel { border-radius: 15px; margin-bottom: 13px; }
      .panel-content { padding: 17px 13px; }
      #langSelector { padding: 17px 12px 20px; }
      #langSelector::before, #langSelector::after { width: 65px; height: 150px; }
      .brand-header { display: block; padding: 18px 14px; text-align: center; }
      .brand-header .club-logo { width: 108px; margin: 0 auto 13px; }
      .btn-lang { display: block; width: 100%; max-width: 300px; margin: 9px auto 0; }
      .bank-info { padding: 13px; }
      .bank-info code { font-size: 14px; letter-spacing: 0; }
      .bank-account-row { gap: 6px; }
      .jokalari-card { padding: 13px 11px; }
    }
  </style>


</head>

    async function kopiatuKontua() {
      const account = document.getElementById("bankAccountNumber").textContent.trim();
      const button = document.getElementById("copyAccountBtn");
      const label = document.getElementById("copyAccountLabel");
      const feedback = document.getElementById("copyAccountFeedback");
      const originalLabel = currentLang === "es" ? "Copiar" : "Kopiatu";
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(account);
        } else {
          const temp = document.createElement("textarea");
          temp.value = account;
          temp.setAttribute("readonly", "");
          temp.style.position = "fixed";
          temp.style.opacity = "0";
          document.body.appendChild(temp);
          temp.select();
          const copied = document.execCommand("copy");
          document.body.removeChild(temp);
          if (!copied) throw new Error("copy failed");
        }
        label.textContent = currentLang === "es" ? "¡Copiado!" : "Kopiatuta!";
        feedback.textContent = "✓";
      } catch (error) {
        label.textContent = currentLang === "es" ? "Selecciona y copia" : "Hautatu eta kopiatu";
        feedback.textContent = "";
      }
      button.setAttribute("aria-label", currentLang === "es" ? "Copiar número de cuenta" : "Kopiatu kontu-zenbakia");
      button.title = currentLang === "es" ? "Copiar número de cuenta" : "Kopiatu kontu-zenbakia";
      window.setTimeout(function() {
        label.textContent = originalLabel;
        feedback.textContent = "";
      }, 2200);
    }

    function addJokalari() {

      header.appendChild(title);

      if (index > 0) {

        removeButton.type = "button";
        removeButton.className = "btn-remove";
        removeButton.textContent = t.remove;
        removeButton.addEventListener("click", function() { removeJokalari(index); });

      }

      card.appendChild(header);

      // Izena
      const nameGroup = document.createElement("div");

      const nameLabel = document.createElement("label");
      nameLabel.textContent = t.name;

      nameGroup.appendChild(nameInput);
      card.appendChild(nameGroup);

      // Aurreinskripzioa

      preLabel.textContent = t.preInsk;
      preLabel.htmlFor = "jokalari_aurreinskripzioa_" + index;

      // Kategoria

      catLabel.htmlFor = "jokalari_kategoria_" + index;
      const catSelect = document.createElement("select");
      catSelect.name = "jokalari_kategoria_" + index;

      catSelect.add(new Option("Txikiak (2019-2020) - 85€", "Txikiak"));
      catSelect.add(new Option("Eskolarrak (2014-2018) - 170€", "Eskolarrak"));
      catSelect.add(new Option("Kadeteak eta Beteranak - 190€", "Kadeteak_Beteranak"));
      catSelect.add(new Option("Junior eta Senior - 230€", "Junior_Senior"));
      catGroup.appendChild(catLabel);
      catGroup.appendChild(catSelect);
      card.appendChild(catGroup);

      // Taldea: kategoriaren arabera soilik erakutsi dagozkion taldeak.
      const teamGroup = document.createElement("div");
      teamGroup.className = "form-group";
      const teamLabel = document.createElement("label");
      teamLabel.textContent = t.team;
      teamLabel.htmlFor = "jokalari_taldea_" + index;
      const teamSelect = document.createElement("select");
      teamSelect.name = "jokalari_taldea_" + index;
      teamSelect.id = teamSelect.name;
      teamSelect.required = true;

      function eguneratuTaldeak() {
        const aurrekoTaldea = teamSelect.value;
        teamSelect.innerHTML = "";
        teamSelect.add(new Option(t.selectTeam, ""));
        const taldeZerrenda = taldeakKategoriarenArabera[catSelect.value] || [];
        taldeZerrenda.forEach(function(taldea) {
          teamSelect.add(new Option(taldea, taldea));
        });
        // Kategoria aldatzean, aurreko taldeak ez du balio berrian jarraitzen.
        if (taldeZerrenda.includes(aurrekoTaldea)) {
          teamSelect.value = aurrekoTaldea;
        } else {
          teamSelect.value = "";
        }
      }

      catSelect.addEventListener("change", function() {
        eguneratuTaldeak();
        kalkulatuGuztira();
      });
      teamGroup.appendChild(teamLabel);
      teamGroup.appendChild(teamSelect);
      card.appendChild(teamGroup);

      container.appendChild(card);
      jokalariIndex++;
      eguneratuJokalariKopurua();
      kalkulatuGuztira();

    function removeJokalari(index) {
      if (index === 0) return;
      const card = document.getElementById("jokalari_" + index);
      if (!card) return;
      card.remove();
      normalizatuJokalariak();
      kalkulatuGuztira();
    }

    function normalizatuJokalariak() {
      const cards = Array.from(document.querySelectorAll("#jokalariakContainer .jokalari-card"));
      cards.forEach(function(card, index) {
        card.id = "jokalari_" + index;
        const title = card.querySelector(".jokalari-header span");
        if (title) title.textContent = i18n[currentLang].playerHeader + " " + (index + 1);

        const fields = card.querySelectorAll("input, select");
        fields.forEach(function(field) {
          const oldName = field.name;
          const prefix = oldName.replace(/\d+$/, "");
          const oldId = field.id;
          const newName = prefix + index;
          field.name = newName;
          field.id = newName;

          const label = Array.from(card.querySelectorAll("label")).find(item => item.htmlFor === oldId);
          if (label) label.htmlFor = newName;
        });

        const header = card.querySelector(".jokalari-header");
        let removeButton = header.querySelector(".btn-remove");
        if (index === 0) {
          if (removeButton) removeButton.remove();
        } else {
          if (!removeButton) {
            removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "btn-remove";
            header.appendChild(removeButton);
          }
          removeButton.textContent = i18n[currentLang].remove;
          removeButton.onclick = function() { removeJokalari(index); };
        }
      });
      jokalariIndex = cards.length;
      eguneratuJokalariKopurua();
    }

    function eguneratuJokalariKopurua() {
      document.getElementById("jokalariKopurua").value = document.querySelectorAll("#jokalariakContainer .jokalari-card").length;
    }

    function kalkulatuGuztira() {
      const basePrecios = { "Txikiak": 85, "Eskolarrak": 170, "Kadeteak_Beteranak": 190, "Junior_Senior": 230 };
      const list = [];

      document.querySelectorAll("#jokalariakContainer .jokalari-card").forEach(function(card) {
        const kat = card.querySelector('select[name^="jokalari_kategoria_"]');
        const aurre = card.querySelector('select[name^="jokalari_aurreinskripzioa_"]');
        if (kat && basePrecios[kat.value]) {
          list.push({ urtekoKuota: basePrecios[kat.value], aurreInsk: aurre ? aurre.value : "bai" });
        }
      });

      list.sort((a, b) => b.urtekoKuota - a.urtekoKuota);
      let guztira = 0;

      list.forEach(function(item, index) {
        let kuota = item.urtekoKuota;
        if (index > 0) kuota *= 0.5;
        if (item.aurreInsk === "bai") kuota = Math.max(0, kuota - 60);
        guztira += kuota;
      });

      document.getElementById("guztiraText").textContent = guztira.toLocaleString("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      eguneratuJokalariKopurua();
    }

    // Argazkiak txikitu bidali aurretik (mugikorreko argazkiak oso handiak izaten dira)
    function prepareReceipt(file) {
      const isImage = /^image\/(jpeg|png|webp)$/.test(file.type) || /\.(jpe?g|png|webp)$/i.test(file.name);
      if (!isImage || !window.createImageBitmap) return Promise.resolve(file);
      return createImageBitmap(file).then(function(bmp) {
        const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
        const w = Math.max(1, Math.round(bmp.width * scale));
        const hgt = Math.max(1, Math.round(bmp.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = hgt;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, hgt);
        ctx.drawImage(bmp, 0, 0, w, hgt);
        return new Promise(function(resolve) {
          canvas.toBlob(function(blob) {
            if (blob && blob.size > 0 && blob.size < file.size) resolve(new File([blob], "ordainagiria.jpg", { type: "image/jpeg" }));
            else resolve(file);
          }, "image/jpeg", 0.85);
        });
      }).catch(function() { return file; });
    }

    function bidaliFormularioa(formObj) {
      if (bidalketaAbian) return;
      const form = document.getElementById("kuotaForm");
      const errorBox = document.getElementById("errorMessage");
      const submitBtn = document.getElementById("submitBtn");
      errorBox.style.display = "none";
      errorBox.textContent = "";
      if (!form.reportValidity()) return;

      const fileInput = document.getElementById("ordainagiria");
      const file = fileInput.files && fileInput.files[0];
      if (!file) { erakutsiErrorea(currentLang === "eu" ? "Igo ordainagiriaren fitxategia." : "Adjunta el justificante de pago."); return; }
      const allowed = ["application/pdf", "image/jpeg", "image/png", "image/webp"];
      const ext = (file.name.split(".").pop() || "").toLowerCase();
      const mimeByExt = {pdf:"application/pdf", jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp"};
      const mimeType = allowed.includes(file.type) ? file.type : mimeByExt[ext];
      if (!mimeType || !allowed.includes(mimeType)) { erakutsiErrorea(currentLang === "eu" ? "Fitxategi mota ez da baliozkoa. Erabili PDF, JPG, PNG edo WEBP." : "Tipo de archivo no válido. Usa PDF, JPG, PNG o WEBP."); return; }
      if (file.size > 10 * 1024 * 1024) { erakutsiErrorea(currentLang === "eu" ? "Fitxategiak gehienez 10 MB izan ditzake." : "El archivo no puede superar los 10 MB."); return; }

      bidalketaAbian = true;
      submitBtn.disabled = true;
      document.getElementById("loading").style.display = "block";
      let fileToSend = file;
      const reader = new FileReader();
      reader.onerror = function() { erakutsiErrorea(currentLang === "eu" ? "Ezin izan da fitxategia irakurri." : "No se pudo leer el archivo."); };
      reader.onload = function(event) {
        try {
          const dataUrl = String(event.target.result || "");
          const comma = dataUrl.indexOf(",");
          if (comma < 0) throw new Error("Ezin izan da fitxategia irakurri / No se pudo leer el archivo.");
          const payload = {lang: currentLang, email: document.getElementById("email").value.trim(), telefonoa: document.getElementById("telefonoa").value.trim(), jokalariKopurua: document.getElementById("jokalariKopurua").value, ordainagiria: {name:fileToSend.name, mimeType:fileToSend.type || mimeType, base64:dataUrl.substring(comma + 1)}};
          const fields = form.querySelectorAll("[name]");
          fields.forEach(function(el) {
            if (!el.name || el.name === "ordainagiria" || el.name === "lang" || el.name === "email" || el.name === "telefonoa" || el.name === "jokalariKopurua") return;
            if (el.type === "file") return;
            payload[el.name] = el.value;
          });
          fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
          })
            .then(function(r) { return r.json(); })
            .then(function(res) {
              if (res && res.success) erakutsiAmaieraPantaila(i18n[currentLang]);
              else erakutsiErrorea(res && res.error ? res.error : i18n[currentLang].genericError);
            })
            .catch(function(error) {
              erakutsiErrorea(error && error.message ? error.message : i18n[currentLang].genericError);
            });
        } catch (e) { erakutsiErrorea(e.message || i18n[currentLang].genericError); }
      };
      prepareReceipt(file).then(function(f) {
        fileToSend = f;
        if (f.size > 10 * 1024 * 1024) { erakutsiErrorea(currentLang === "eu" ? "Fitxategiak gehienez 10 MB izan ditzake." : "El archivo no puede superar los 10 MB."); return; }
        reader.readAsDataURL(f);
      });
    }

    function erakutsiErrorea(message) {
      bidalketaAbian = false;
      const errorBox = document.getElementById("errorMessage");
      errorBox.textContent = message;
      errorBox.style.display = "block";
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("loading").style.display = "none";
    }

    function erakutsiAmaieraPantaila(t) {
      document.body.innerHTML = `
        <div class="container">
          <div class="panel success-header">
            <h2>${t.successTitle}</h2>
            <p>${t.successMsg}</p>
          </div>
        </div>
      `;
    }
  </script>
