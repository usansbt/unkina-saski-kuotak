<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saskibaloi Taldeko Inskripzioa / Inscripción</title>
  <style>
    :root {
      --primary: #d9534f;
      --primary-hover: #c9302c;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #cccccc;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      text-align: center;
      color: #222;
    }

    .lang-selector {
      text-align: center;
      margin-bottom: 20px;
    }

    .lang-btn {
      background-color: #0275d8;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .lang-btn:hover {
      background-color: #025aa5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .jokalari-card {
      border: 1px solid var(--border-color);
      background-color: #fafafa;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      position: relative;
    }

    .jokalari-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: bold;
      color: var(--primary);
    }

    .btn-action {
      background-color: #5cb85c;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }

    .btn-action:hover {
      background-color: #4cae4c;
    }

    .btn-remove {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 18px;
      margin-top: 20px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .summary-box {
      background-color: #e9ecef;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }

    #loading {
      display: none;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      color: #0275d8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Saskibaloi Taldea / Club de Baloncesto</h1>
    
    <!-- Hizkuntza Hautaketa -->
    <div id="langSelector" class="lang-selector">
      <p>Aukeratu hizkuntza / Selecciona el idioma:</p>
      <button type="button" class="lang-btn" onclick="selectLanguage('eu')">Euskara</button>
      <button type="button" class="lang-btn" onclick="selectLanguage('es')">Castellano</button>
    </div>

    <!-- Formulario Nagusia -->
    <form id="mainForm" style="display: none;" onsubmit="bidaliFormularioa(event)">
      
      <h2>Tutor / Arduradunaren Datuak</h2>
      <div class="form-group">
        <label for="tutor_izena">Tutorraren Izen-Abizenak / Nombre del Tutor/a</label>
        <input type="text" id="tutor_izena" name="tutor_izena" required>
      </div>
      <div class="form-group">
        <label for="email">Posta Elektronikoa / Correo Electrónico</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="telefonoa">Telefonoa / Teléfono</label>
        <input type="tel" id="telefonoa" name="telefonoa" required>
      </div>

      <hr style="margin: 25px 0;">

      <h2>Jokalariak / Jugadores</h2>
      <div id="jokalariakContainer"></div>

      <button type="button" class="btn-action" onclick="gehituJokalaria()">+ Gehitu beste jokalari bat / Añadir otro jugador</button>

      <!-- Laburpena eta Ordainketa -->
      <div class="summary-box">
        <h3>Ordaindu beharreko guztiak / Total a pagar</h3>
        <p style="font-size: 20px; font-weight: bold; color: var(--primary);" id="totalKuota">0 €</p>
      </div>

      <button type="submit" class="btn-submit">Bidali Inskripzioa / Enviar Inscripción</button>
      <div id="loading">Bidalitzen... / Enviando...</div>
    </form>
  </div>

  <script>
    // ALDATU HAU ZURE GOOGLE APPS SCRIPT WEB APP-AREN URL ZUZENAGATIK
    const API_URL = "TEU_APPS_SCRIPT_WEB_APP_URL_HEMEN";

    let hizkuntza = 'eu';
    let taldeakZerrenda = ["Besteak"]; // Lehenetsitako balioa taldeak iritsi bitartean

    // Orria kargatzean Google Sheets-etik taldeak bildu
    window.addEventListener('DOMContentLoaded', () => {
      kargatuTaldeak();
    });

    async function kargatuTaldeak() {
      try {
        const response = await fetch(`${API_URL}?action=getTaldeak`);
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          taldeakZerrenda = data;
          eguneratuTaldeDesplegarriak();
        }
      } catch (error) {
        console.error("Errorea taldeak kargatzerakoan:", error);
      }
    }

    function selectLanguage(lang) {
      hizkuntza = lang;
      document.getElementById('langSelector').style.display = 'none';
      document.getElementById('mainForm').style.display = 'block';
      gehituJokalaria(); // Lehenengo jokalaria gehitu
    }

    function gehituJokalaria() {
      const container = document.getElementById('jokalariakContainer');
      const index = container.children.length;

      const card = document.createElement('div');
      card.className = 'jokalari-card';

      let taldeakOptions = taldeakZerrenda.map(t => `<option value="${t}">${t}</option>`).join('');

      card.innerHTML = `
        <div class="jokalari-header">
          <span>Jokalaria / Jugador ${index + 1}</span>
          ${index > 0 ? `<button type="button" class="btn-remove" onclick="kenduJokalaria(this)">Ezabatu / Eliminar</button>` : ''}
        </div>
        <div class="form-group">
          <label>Izen-Abizenak / Nombre y Apellidos</label>
          <input type="text" class="jokalari-izena" name="jokalari_izena_${index}" required>
        </div>
        <div class="form-group">
          <label>Kategoria / Categoría</label>
          <select class="jokalari-kategoria" name="jokalari_kategoria_${index}" onchange="kalkulatuGuztira()" required>
            <option value="">-- Hautatu / Selecciona --</option>
            <option value="Txikiak" data-precio="85">Txikiak (85€)</option>
            <option value="Eskolarrak" data-precio="170">Eskolarrak (170€)</option>
            <option value="Kadeteak_Beteranak" data-precio="190">Kadeteak / Beteranak (190€)</option>
            <option value="Junior_Senior" data-precio="230">Junior / Senior (230€)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Taldea / Equipo</label>
          <select class="jokalari-taldea" name="jokalari_taldea_${index}">
            ${taldeakOptions}
          </select>
        </div>
        <div class="form-group">
          <label>Aurreinskripzioa eginda? / ¿Preinscripción hecha? (60€ deskontua)</label>
          <select class="jokalari-aurre" name="jokalari_aurre_${index}" onchange="kalkulatuGuztira()">
            <option value="ez">Ez / No</option>
            <option value="bai">Bai / Sí (-60€)</option>
          </select>
        </div>
      `;

      container.appendChild(card);
      kalkulatuGuztira();
    }

    function kenduJokalaria(button) {
      const card = button.closest('.jokalari-card');
      card.remove();
      kalkulatuGuztira();
    }

    function eguneratuTaldeDesplegarriak() {
      const selects = document.querySelectorAll('.jokalari-taldea');
      let taldeakOptions = taldeakZerrenda.map(t => `<option value="${t}">${t}</option>`).join('');
      selects.forEach(select => {
        const balioa = select.value;
        select.innerHTML = taldeakOptions;
        if (balioa) select.value = balioa;
      });
    }

    function kalkulatuGuztira() {
      let guztira = 0;
      const jokalariak = document.querySelectorAll('.jokalari-card');

      jokalariak.forEach(card => {
        const kategoriaSelect = card.querySelector('.jokalari-kategoria');
        const aurreSelect = card.querySelector('.jokalari-aurre');

        const selectedOption = kategoriaSelect.options[kategoriaSelect.selectedIndex];
        let precio = selectedOption ? parseFloat(selectedOption.getAttribute('data-precio')) || 0 : 0;

        if (aurreSelect.value === 'bai' && precio > 0) {
          precio = Math.max(0, precio - 60);
        }

        guztira += precio;
      });

      document.getElementById('totalKuota').innerText = guztira + " €";
    }

    async function bidaliFormularioa(event) {
      event.preventDefault();
      document.getElementById('loading').style.display = 'block';

      const form = document.getElementById('mainForm');
      const formData = new FormData(form);
      const dataObj = {};

      formData.forEach((value, key) => {
        dataObj[key] = value;
      });

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dataObj)
        });

        alert("Inskripzioa zuzen bidali da! / ¡Inscripción enviada correctamente!");
        form.reset();
        document.getElementById('jokalariakContainer').innerHTML = '';
        gehituJokalaria();
      } catch (error) {
        console.error("Errorea bidaltzean:", error);
        alert("Errore bat gertatu da bidaltzean. / Error al enviar.");
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }
  </script>
</body>
</html>
